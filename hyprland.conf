# Dual-tone sweep: aurora green holds two stops, violet only closes it.
# Keep in sync with hyprland_active_border / hyprland_inactive_border in colors.toml.
$activeBorderColor = rgba(62e2a4ee) rgba(a8f0b3dd) rgba(9d8cff88) 35deg
$inactiveBorderColor = rgba(3f5a4c99)
$shadowColor = rgba(0508078c)

general {
    col.active_border = $activeBorderColor
    col.inactive_border = $inactiveBorderColor
    border_size = 2
    gaps_in = 8
    gaps_out = 15
}

group {
    col.border_active = $activeBorderColor
    col.border_inactive = $inactiveBorderColor
}

decoration {
    dim_inactive = false
    rounding = 14

    # Blur radius is GLOBAL in Hyprland; there is no per-window blur strength.
    # This affects every transparent surface for every user of this theme.
    blur {
        enabled = true
        size = 24
        passes = 4
        noise = 0.03
        contrast = 1.45
        brightness = 1.15
        vibrancy = 0.03
        vibrancy_darkness = 0.7
        xray = true
        ignore_opacity = true
        special = true
    }

    shadow {
        enabled = true
        range = 16
        render_power = 3
        color = $shadowColor
        color_inactive = $shadowColor
        offset = 2 2
    }
}

# Soft drift through tinted glass: buoyant, never elastic.
animations {
    enabled = true

    bezier = auroraFloat, 0.22, 0.9, 0.2, 1.0
    bezier = auroraDrift, 0.3, 1.05, 0.38, 1.0
    bezier = glassFade, 0.18, 0.0, 0.12, 1.0
    bezier = workspaceGlide, 0.23, 0.84, 0.34, 1.0

    animation = windows, 1, 5, auroraFloat
    animation = windowsIn, 1, 5, auroraDrift, popin 10%
    animation = windowsOut, 1, 4, glassFade, popin 82%
    animation = windowsMove, 1, 5, auroraFloat

    animation = border, 1, 6, glassFade
    animation = fade, 1, 5, glassFade
    animation = layers, 1, 5, auroraDrift, slidefade
    animation = layersIn, 1, 5, auroraDrift, slidefade
    animation = layersOut, 1, 4, glassFade, fade
    animation = workspaces, 1, 7, workspaceGlide, slide
}

# Five band rules — catch-all opacity for groups. Last-wins in Hyprland means pins must follow.
windowrule = opacity 0.80 0.80, match:tag default-opacity
windowrule = opacity 0.90 0.90, match:tag chromium-based-browser
windowrule = opacity 0.90 0.90, match:tag firefox-based-browser
windowrule = opacity 0.90 0.90, match:class (chromium-[a-z0-9-]+|chrome-.*__-Default|brave-.*)
windowrule = opacity 0.80 0.80, match:class ^(org.gnome.Nautilus|nautilus)$

# SEVEN opacity pins — specific windows pinned to full opacity.
# Fact (a): Credential DESKTOP classes keep the default-opacity tag because bitwarden.conf and
# 1password.conf never strip it, so the `match:tag default-opacity` band catches them. Video PWA
# classes have default-opacity stripped upstream by browser.conf; they are caught instead by the
# `chrome-.*__-Default` class band, which is why that band must not be removed. Hyprland 0.56
# `match:class` is a FULL match, so `chrome-.*__-Default` catches
# chrome-youtube.com__-Default but not chrome-nngceckbapebfimnlniiiahkandclblb-Default.
# Fact (b): Alacritty and kitty are pinned at 1 1 DELIBERATELY. Their shipped configs use
# background-level transparency, keeping glyphs at full alpha. Zed is compositor-pinned opaque
# so that, if the user enables background transparency in Zed, it composes cleanly rather than
# stacking with compositor opacity; this theme ships no Zed configuration. Ghostty and Foot
# intentionally remain opaque.
# Fact (c): Credential pin exists because a translucent password window leaks to onlookers
# and screen recordings. It covers both Bitwarden BROWSER EXTENSION and desktop apps.
windowrule = opacity 1 1, match:tag terminal
windowrule = opacity 1 1, match:class ^dev\.zed\.Zed$
windowrule = opacity 1 1, match:class ^(chrome-youtube\.com__-Default|chrome-app\.zoom\.us__wc_home-Default|chrome-www\.crunchyroll\.com__-Default|brave-youtube\.com__-Default|brave-www\.crunchyroll\.com__-Default|brave-www\.jiohotstar\.com__-Default|brave-reanime\.to__home-Default)$
windowrule = opacity 1 1, match:tag pip
windowrule = opacity 1 1, match:title WebcamOverlay
windowrule = opacity 1 1, match:class ^(1[pP]assword|Bitwarden|org.keepassxc.KeePassXC|Proton Pass|chrome-nngceckbapebfimnlniiiahkandclblb-Default)$
windowrule = opacity 1 1, match:class ^(GeForceNOW|com.moonlight_stream.Moonlight)$

# FIVE layer rules — blur and alpha control for UI surfaces.
layerrule = blur on, match:namespace waybar
layerrule = blur on, match:namespace walker
layerrule = blur on, match:namespace notifications
layerrule = ignore_alpha 0.5, match:namespace waybar
layerrule = ignore_alpha 0.5, match:namespace walker
