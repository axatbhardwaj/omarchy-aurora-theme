# Aurora. The bar folds its 42% scrim over the 2% base into one RGBA.

[bar]
background       = "#0a100d"
background-alpha = 0.4316
text             = "#edf7ef"
active           = "#85d9ac"
scale-with-font  = true
size-horizontal  = 30
size-vertical    = 32

[hyprland]
active-border            = "rgba(85d9acff)"
active-border-foreground = "rgb(85d9ac)"

[controls]
# Quiet controls stay dim green without outlining every element.
normal-color        = "#edf7ef"
normal-fill-alpha   = 0.05
normal-border       = "#727773"
normal-border-width = 0
normal-border-alpha = 0.0

hover-cursor-color        = "#edf7ef"
hover-cursor-fill-alpha   = 0.10
hover-cursor-border       = "#85d9ac"
hover-cursor-border-width = 0
hover-cursor-border-alpha = 0.0

# Focus catches the green lead and the pale-green structural edge together.
focus-color        = "#edf7ef"
focus-fill-alpha   = 0.13
focus-border       = "hyprland.active-border-foreground"
focus-border-width = 1
focus-border-alpha = 0.72

# Persistent selection uses a soft green fill with one disciplined underline.
selected-color        = "#edf7ef"
selected-fill-alpha   = 0.20
selected-border       = "#85d9ac"
selected-border-width = "0 0 1 0"
selected-border-alpha = 0.82

pressed-fill-alpha   = 0.24
selection-fill-alpha = 0.34

[spacing]
scale = 1.08
scale-with-font = true
control-gap       = 9
control-padding-x = 12
control-padding-y = 7
input-padding-y   = 8
control-height    = 31
popup-row-height  = 32
row-gap           = 9
row-padding-x     = 14
label-gap         = 5
panel-gap         = 16
panel-padding     = 20
popup-padding     = 17

[font]
base-size     = 12
caption       = 10
body-small    = 11
body          = 12
subtitle      = 13
title         = 15
heading       = 18
display       = 26
display-large = 31
icon-small    = 11
icon          = 14
icon-large    = 19

[popups]
background       = "#0e1613"
background-alpha = 0.90
text             = "#edf7ef"
border           = "hyprland.active-border"
border-alpha     = 0.72
border-width     = 2

[tooltip]
background       = "#0e1613"
background-alpha = 0.96
text             = "#edf7ef"
border           = "#6fd48c"
border-alpha     = 0.68

[notifications]
background       = "#0e1613"
background-alpha = 0.92
text             = "#edf7ef"
border           = "hyprland.active-border"
border-alpha     = 0.78
border-width     = 2
countdown        = "#85d9ac"

[launcher]
background                = "#0e1613"
background-alpha          = 0.91
text                      = "#edf7ef"
border                    = "hyprland.active-border"
border-alpha              = 0.78
border-width              = 2
scrim                     = "#060a08"
scrim-alpha               = 0.60
selected-background       = "#85d9ac"
selected-background-alpha = 0.20
selected-text             = "#edf7ef"
selected-border           = "hyprland.active-border-foreground"
selected-border-alpha     = 0.78
selected-border-width     = 1

[menu]
background                = "#0e1613"
background-alpha          = 0.93
text                      = "#edf7ef"
border                    = "hyprland.active-border"
border-alpha              = 0.76
border-width              = 2
scrim                     = "#060a08"
scrim-alpha               = 0.56
selected-background       = "#85d9ac"
selected-background-alpha = 0.20
selected-text             = "#edf7ef"
selected-border           = "hyprland.active-border-foreground"
selected-border-alpha     = 0.74
selected-border-width     = 1

[polkit]
background       = "#0e1613"
background-alpha = 0.96
text             = "#edf7ef"
text-error       = "#ff9bb3"
border           = "hyprland.active-border"
border-error     = "#ff9bb3"
border-alpha     = 0.88
scrim            = "#060a08"
scrim-alpha      = 0.66
accent           = "#85d9ac"

[lock]
background       = "#0e1613"
background-alpha = 0.84
text             = "#edf7ef"
placeholder      = "#b0c8bc"
text-error       = "#ff9bb3"
border           = "#727773"
border-active    = "hyprland.active-border"
border-error     = "#ff9bb3"
border-alpha     = 0.88
selection        = "#85d9ac"
selection-alpha  = 0.40

[image-picker]
scrim                   = "#060a08"
scrim-alpha             = 0.66
text                    = "#edf7ef"
selected-border         = "hyprland.active-border"
selected-border-alpha   = 1.0
unselected-border       = "#727773"
unselected-border-alpha = 0.42
