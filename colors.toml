mode = "dark"

# Aurora is a green glass theme: aurora green leads (accent, focus, selection,
# frames; text stays white) and teal closes the active-border sweep. No violet
# anywhere: ANSI blue is a sea blue and magenta an orchid rose so terminal output
# reads green-led, not lavender.

accent = "#62e2a4"
selection = "#62e2a4"
selection_foreground = "#0a100d"
muted = "#6f9a82"

background = "#0a100d"
dark_background = "#070c0a"
darker_background = "#050807"
lighter_background = "#12221a"

foreground = "#fdfffd"
dark_foreground = "#3f5a4c"
light_foreground = "#ffffff"
bright_foreground = "#ffffff"

red = "#f0708e"
yellow = "#e6d59a"
orange = "#e0b283"
green = "#6fd48c"
cyan = "#7dd6c8"
blue = "#5fb3d9"
magenta = "#d98cc0"
brown = "#5c6e4a"

bright_red = "#ff9bb3"
bright_yellow = "#f3e8c2"
bright_green = "#a8f0b3"
bright_cyan = "#b0eadf"
bright_blue = "#93d2ec"
bright_magenta = "#eeb4d8"

# Omarchy 4 renders these into hyprland.lua and shell.toml border tokens.
# Green holds two of three stops; teal closes the sweep.
hyprland_active_border = "rgba(62e2a4ee) rgba(a8f0b3dd) rgba(7dd6c888) 35deg"
hyprland_inactive_border = "rgba(3f5a4c99)"
