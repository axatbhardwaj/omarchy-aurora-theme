mode = "dark"

# Elysian is a dual-tone glass theme: aurora green leads (accent, focus,
# selection, text, frames), twilight violet is confined to the closing stop
# of the active border and the ANSI blue/magenta slots. Both must stay visible in every shell surface.

accent = "#62e2a4"
selection = "#62e2a4"
selection_foreground = "#0a100d"
muted = "#6f9a82"

background = "#0a100d"
dark_background = "#070c0a"
darker_background = "#050807"
lighter_background = "#12221a"

foreground = "#c9eedb"
dark_foreground = "#3f5a4c"
light_foreground = "#dbf6e7"
bright_foreground = "#eefff5"

red = "#f0708e"
yellow = "#e6d59a"
orange = "#e0b283"
green = "#6fd48c"
cyan = "#7dd6c8"
blue = "#7d8cff"
magenta = "#b48cff"
brown = "#5c4a6e"

bright_red = "#ff9bb3"
bright_yellow = "#f3e8c2"
bright_green = "#a8f0b3"
bright_cyan = "#b0eadf"
bright_blue = "#a9b3ff"
bright_magenta = "#d2bcff"

# Omarchy 4 renders these into hyprland.lua and shell.toml border tokens.
# Green holds two of three stops; violet only closes the sweep.
hyprland_active_border = "rgba(62e2a4ee) rgba(a8f0b3dd) rgba(9d8cff88) 35deg"
hyprland_inactive_border = "rgba(3f5a4c99)"
