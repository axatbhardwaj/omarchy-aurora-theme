# Background-only transparency: Alacritty renders glyphs at full alpha, so text
# stays crisp while the background lets Hyprland's blur through. This is why the
# compositor rule pins terminals to `opacity 1 1` — stacking both would fade text.
[window]
opacity = 0.75

[colors.primary]
background = "#010401"
foreground = "#fdfffd"

[colors.cursor]
text = "#010401"
cursor = "#fdfffd"

[colors.vi_mode_cursor]
text = "#010401"
cursor = "#fdfffd"

[colors.search.matches]
foreground = "#010401"
background = "#dfec63"

[colors.search.focused_match]
foreground = "#010401"
background = "#bf5a7c"

[colors.footer_bar]
foreground = "#010401"
background = "#fdfffd"

[colors.selection]
text = "#010401"
background = "#fdfffd"

[colors.normal]
black = "#010401"
red = "#bf5a7c"
green = "#70cf6c"
yellow = "#dfec63"
blue = "#62e2a4"
magenta = "#e0eb7a"
cyan = "#9ed8dd"
white = "#bff2ab"

[colors.bright]
black = "#518a51"
red = "#dcb0be"
green = "#b4e8b2"
yellow = "#f6fdb7"
blue = "#b0f3d2"
magenta = "#f8fdce"
